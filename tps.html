<!DOCTYPE html>

    Cette page affiche les travaux pratiques dans un carrousel.

    - Affichage du titre et de la description
    - Lien vers le PDF dans un nouvel onglet
-->
<html lang="fr">

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Favicons -->
	<link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
	<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
	<link rel="android-icon" sizes="192x192" href="assets/icons/android-chrome-192x192.png">
	<link rel="android-icon" sizes="512x512" href="assets/icons/android-chrome-512x512.png">
	<link rel="manifest" href="assets/icons/site.webmanifest">

	<!-- Bibliothèques et CSS -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	<link rel="stylesheet" href="css/style.css">
	
	<title>Portfolio - Léo Metgy</title>

<body class="projets-page">
	<!-- Scripts -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
	<script src="js/stars.js"></script>
	<script src="js/menu.js"></script>
	<!-- Script qui génère les cartes de TPs -->
	<script src="js/tps.js"></script>
	<script src="js/music-player.js"></script>
	<script src="js/inject-music-player.js"></script>
	<script src="js/navigation.js"></script>
	<script src="js/footer-scroll.js"></script>

	<!-- Script du routeur SPA pour la navigation sans rechargement -->
	<script src="js/spa-router.js"></script>

	<!-- Navigation -->
	<header>

		<div class="sidebar-profile">

				<a href="https://github.com/Goken-0" title="GitHub" target="_blank" rel="noopener" class="social-github"><i class="fa-brands fa-github"></i></a>
			</div>
		</div>

		<nav>
			<a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
			<a href="cv.html"><i class="fa-solid fa-file-lines"></i><span>CV</span></a>
			<a href="lettremotivation.html"><i class="fa-solid fa-envelope-open-text"></i><span>Lettre de motivation</span></a>

					<a href="tps.html"><i class="fa-solid fa-flask"></i>TPs</a>
					<a href="projets.html"><i class="fa-solid fa-diagram-project"></i>Projets</a>

			<a href="competences.html"><i class="fa-solid fa-code"></i><span>Compétences</span></a>
			<a href="veille.html"><i class="fa-solid fa-satellite-dish"></i><span>Veille</span></a>

			<div class="filters" id="tps-filters">
				<button class="filter-btn active" data-filter="all">

				</button>
				<button class="filter-btn" data-filter="virtualisation">
					<i class="fas fa-desktop"></i> Virtualisation
				</button>
				<button class="filter-btn" data-filter="linux">
					<i class="fab fa-linux"></i> Linux

				<button class="filter-btn" data-filter="scripting">
					<i class="fas fa-terminal"></i> Scripting
				</button>

				</button>

				</button>

			</div>

	<script src="js/typing.js"></script>
