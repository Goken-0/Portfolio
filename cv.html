<!DOCTYPE html>
<!--

    PAGE CV (CURRICULUM VITAE)

    Cette page affiche le CV sous forme d'image.

    - Cliquer sur l'image pour l'agrandir dans un modal
    - Zoomer/dézoomer dans le modal

-->

	     MÉTADONNÉES DE LA PAGE

	               style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline'; 
	               font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; 
	               img-src 'self' data: blob:; 
	               media-src 'self' blob:; 
	               connect-src 'self'; 
	               frame-ancestors 'none'; 
	               base-uri 'self'; 
	               form-action 'self';">

	<link rel="manifest" href="assets/icons/site.webmanifest">

	     BIBLIOTHÈQUES EXTERNES

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
	
	<!-- Fichier CSS principal -->
	<link rel="stylesheet" href="css/style.css">
	
	<!-- Titre de l'onglet -->

			<div class="dropdown">

					<a href="projets.html"><i class="fa-solid fa-diagram-project"></i>Projets</a>

			<a href="competences.html"><i class="fa-solid fa-code"></i><span>Compétences</span></a>
