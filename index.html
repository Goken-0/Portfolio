<!DOCTYPE html>
<!-- 
    ============================================
    PAGE D'ACCUEIL DU PORTFOLIO
    ============================================
    
    Cette page est la première page que les visiteurs voient.
    Elle contient :
    - Une présentation personnelle
    - Des liens vers les réseaux sociaux
    - Le lecteur audio (injecté automatiquement)
    - Le fond animé avec étoiles 3D
-->
<html lang="fr">

<head>
	<!-- ============================================
	     MÉTADONNÉES DE LA PAGE
	     ============================================ -->
	
	<!-- Encodage UTF-8 : permet d'afficher les caractères spéciaux et emojis -->
	<meta charset="UTF-8">

	<!-- Viewport : permet au site de s'adapter aux écrans (PC, mobile, tablette) -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- Content Security Policy (CSP) : sécurité contre les attaques XSS et injections -->
	<meta http-equiv="Content-Security-Policy" 
	      content="default-src 'self'; 
	               script-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com 'unsafe-inline' 'unsafe-eval'; 
	               style-src 'self' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com 'unsafe-inline'; 
	               font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com data:; 
	               img-src 'self' data: blob:; 
	               media-src 'self' blob:; 
	               connect-src 'self' https://formspree.io; 
	               frame-ancestors 'none'; 
	               base-uri 'self'; 
	               form-action 'self' https://formspree.io;">

	<!-- SEO : description et mots-clés pour les moteurs de recherche -->
	<meta name="description" content="Portfolio de Léo Metgy, étudiant en BTS SIO. Découvrez mes projets, compétences, stages et réalisations en réseau et sécurité informatique.">
	<meta name="keywords" content="portfolio, BTS SIO, réseau, sécurité, Léo Metgy, CV, projets, stages">
	<meta name="author" content="Léo Metgy">
	<meta name="robots" content="index, follow">

	<!-- Open Graph : affichage optimisé sur les réseaux sociaux -->
	<meta property="og:title" content="Portfolio Léo Metgy - Étudiant BTS SIO">
	<meta property="og:description" content="Découvrez mes projets, compétences et réalisations en informatique.">
	<meta property="og:type" content="website">
	<meta property="og:url" content="https://goken-0.github.io/Portfolio/">
	<meta property="og:image" content="https://goken-0.github.io/Portfolio/assets/images/main.png">

	<!-- Twitter Card -->
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:title" content="Portfolio Léo Metgy">
	<meta name="twitter:description" content="Portfolio BTS SIO - Réseau & Sécurité">

	<!-- ============================================
	     FAVICONS (ICÔNES DE L'ONGLET)
	     ============================================ -->
	<!-- Différentes tailles pour différents appareils et navigateurs -->
	<link rel="icon" href="assets/icons/favicon.ico" type="image/x-icon">
	<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16x16.png">
	<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32x32.png">
	<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
	<link rel="android-icon" sizes="192x192" href="assets/icons/android-chrome-192x192.png">
	<link rel="android-icon" sizes="512x512" href="assets/icons/android-chrome-512x512.png">
	<link rel="manifest" href="assets/icons/site.webmanifest">

	<!-- ============================================
	     BIBLIOTHÈQUES EXTERNES
	     ============================================ -->
	<!-- Font Awesome : bibliothèque d'icônes (LinkedIn, GitHub, etc.) -->
	<link rel="stylesheet" 
	      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" 
	      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" 
	      crossorigin="anonymous" />

	<!-- ============================================
	     FICHIERS CSS
	     ============================================ -->
	<!-- Fichier CSS principal : contient tous les styles du site -->
	<link rel="stylesheet" href="css/style.css">

	<!-- Titre affiché dans l'onglet du navigateur -->
	<title>Portfolio - Léo Metgy</title>
</head>

<body>
	<!-- ============================================
	     SCRIPTS CHARGÉS EN PREMIER
	     ============================================
	     Ces scripts sont chargés avant le contenu pour être disponibles rapidement
	-->
	
	<!-- Three.js : bibliothèque JavaScript 3D pour créer le fond animé avec étoiles -->
	<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" 
	        integrity="sha384-CI3ELBVUz9XQO+97x6nwMDPosPR5XvsxW2ua7N1Xeygeh1IxtgqtCkGfQY9WWdHu" 
	        crossorigin="anonymous"></script>

	<!-- Script qui crée et anime les étoiles 3D en arrière-plan -->
	<script src="js/stars.js"></script>

	<!-- Script qui gère le menu hamburger (trois lignes) sur mobile -->
	<script src="js/menu.js"></script>

	<!-- Script du lecteur de musique : contient la classe MusicPlayer -->
	<!-- IMPORTANT : doit être chargé AVANT inject-music-player.js -->
	<script src="js/music-player.js"></script>
	
	<!-- Script qui injecte automatiquement le lecteur audio sur la page -->
	<script src="js/inject-music-player.js"></script>
	
	<!-- Script qui met automatiquement en surbrillance le lien de la page active -->
	<script src="js/navigation.js"></script>
	
	<!-- Script qui gère l'affichage/masquage du footer lors du scroll -->
	<script src="js/footer-scroll.js"></script>

	<!-- Script du routeur SPA pour la navigation sans rechargement -->
	<script src="js/spa-router.js"></script>

	<!-- ============================================
	     EN-TÊTE ET NAVIGATION
	     ============================================ -->
	<header>
		<div class="sidebar-top">
			<button class="sidebar-close" aria-label="Fermer le menu"><i class="fa-solid fa-xmark"></i></button>
		</div>

		<!-- Photo de profil avec animation 3D -->
		<div class="sidebar-profile">
			<div class="profile-card" id="profileCard">
				<div class="profile-card-inner">
					<img src="assets/images/main.png" alt="Photo de profil de Léo Metgy" class="profile-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
					<div class="profile-placeholder"><i class="fa-solid fa-user"></i></div>
				</div>
				<div class="profile-glow"></div>
			</div>
			<h2 class="profile-name">Léo ✌️</h2>
			<p class="profile-title">Étudiant BTS SIO</p>
			<div class="sidebar-social">
				<a href="https://www.linkedin.com/in/l%C3%A9o-metgy-3268a5383/" title="LinkedIn" target="_blank" rel="noopener" class="social-linkedin"><i class="fa-brands fa-linkedin"></i></a>
				<a href="https://github.com/Goken-0" title="GitHub" target="_blank" rel="noopener" class="social-github"><i class="fa-brands fa-github"></i></a>
				<a href="contact.html" title="Me contacter" class="social-contact"><i class="fa-solid fa-envelope"></i></a>
			</div>
		</div>

		<nav>
			<a href="index.html"><i class="fa-solid fa-house"></i><span>Accueil</span></a>
			<div class="dropdown">
				<a href="#" class="dropbtn"><i class="fa-solid fa-user-graduate"></i><span>Parcours</span><i class="fa fa-caret-down caret-icon"></i></a>
				<div class="dropdown-content">
					<a href="cv.html"><i class="fa-solid fa-file-lines"></i>CV</a>
					<a href="lettremotivation.html"><i class="fa-solid fa-envelope-open-text"></i>Motivation</a>
				</div>
			</div>
			<div class="dropdown">
				<a href="#" class="dropbtn"><i class="fa-solid fa-layer-group"></i><span>Réalisations</span><i class="fa fa-caret-down caret-icon"></i></a>
				<div class="dropdown-content" id="myDropdown">
					<a href="tps.html"><i class="fa-solid fa-flask"></i>TPs</a>
					<a href="projets.html"><i class="fa-solid fa-diagram-project"></i>Projets</a>
					<a href="stages.html"><i class="fa-solid fa-briefcase"></i>Stages</a>
				</div>
			</div>
			<a href="competences.html"><i class="fa-solid fa-code"></i><span>Compétences</span></a>
			<a href="veille.html"><i class="fa-solid fa-satellite-dish"></i><span>Veille</span></a>
			<a href="contact.html"><i class="fa-solid fa-envelope"></i><span>Contact</span></a>
		</nav>
		<div class="sidebar-bottom">
			<p class="sidebar-footer-credit">Fait avec ❤️ par Léo</p>
		</div>
	</header>

	<!-- Bouton mobile (Hamburger) -->
	<div class="hamburger-toggle">
		<span></span>
		<span></span>
		<span></span>
	</div>

	<!-- Overlay mobile -->
	<div class="sidebar-overlay"></div>

	<!-- ============================================
	     SECTION D'ACCUEIL
	     ============================================ -->
	<section class="home">
		<!-- Image de présentation (photo de profil) -->
		<div class="home-img">
			<div class="profile-card home-profile-card">
				<div class="profile-card-inner">
					<img src="assets/images/main.png" 
						 alt="Photo de profil de Léo Metgy" 
						 class="profile-img">
					<div class="profile-placeholder"><i class="fa-solid fa-user"></i></div>
				</div>
				<div class="profile-glow"></div>
			</div>
		</div>
		<!-- Contenu textuel de présentation -->
		<div class="home-content">
			<!-- Titre principal avec le prénom en surbrillance -->
			<h1>Bonjour, je m'appelle <span>Léo</span></h1>
			
			<!-- Sous-titre avec animation de rotation de mots -->
			<h3 class="typing-text">Je suis <span class="rotate-wrap"><span class="word-visible">étudiant en BTS SIO</span></span><span class="typing-cursor"></span></h3>
			
			<!-- Phrase d'accroche -->
			<p class="sentence">
				L'informatique m'anime depuis toujours : bienvenue dans mon univers numérique.
			</p>

			<!-- ============================================
			     ICÔNES RÉSEAUX SOCIAUX
			     ============================================ -->
			<div class="social-icons">
				<!-- Lien vers le profil LinkedIn -->
				<a href="https://www.linkedin.com/in/l%C3%A9o-metgy-3268a5383/">

				</a>
				
				<!-- Lien vers le profil GitHub -->
				<a href="https://github.com/Goken-0">
					<i class="fa-brands fa-github"></i>
				</a>
			</div>

			<!-- Bouton pour aller à la page contact -->
			<a href="contact.html" class="btn">Me contacter</a>

			<!-- 
				LECTEUR DE MUSIQUE
				Le lecteur sera automatiquement injecté ici par inject-music-player.js

			-->
		</div>

	</section>
	<script src="js/typing.js"></script>
	<script src="js/cursor.js"></script>

</html>
